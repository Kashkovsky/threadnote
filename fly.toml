# fly.toml app configuration file generated for threadnote-telemetry on 2026-08-13T17:49:20+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'threadnote-telemetry'
primary_region = 'fra'

[build]
  dockerfile = 'infra/telemetry-gateway/Dockerfile'

[deploy]
  strategy = 'canary'
  max_unavailable = 1

[env]
  THREADNOTE_TELEMETRY_PUBLIC_INGESTION = 'enabled'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 2
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 3
    hard_limit = 4

  [http_service.http_options.response]
    pristine = true

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/healthz'
    protocol = 'http'
    timeout = '5s'

    [http_service.checks.headers]
      X-Threadnote-Internal-Health = 'fly-service-check-v1'

[[vm]]
  memory = '512mb'
  cpus = 1
