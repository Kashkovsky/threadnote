# fly.toml app configuration file generated for threadnote-telemetry on 2026-08-13T17:49:20+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'threadnote-telemetry'
primary_region = 'fra'

[build]
  dockerfile = 'infra/telemetry-gateway/Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 3
    hard_limit = 4

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'
    protocol = 'http'

[[vm]]
  memory = '512mb'
  cpus = 1
