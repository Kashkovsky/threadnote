name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/release-notes/**'
      - '.gitignore'
      - '.threadnoteignore'
      - '*.md'
      - 'LICENSE'
      - 'docs/**'
      - 'website/**'
  pull_request:
    branches: [main, codex/4.0.0]

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  E2E_EMBEDDING_MODEL_ID: bge-small-en-v1.5-q8
  E2E_EMBEDDING_MODEL_SHA256: f046db1dc724cf4f6f0a0c5917e922823b73eb1d27b8f9a9c2797f7866974804

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      actions: ${{ steps.scopes.outputs.actions }}
      code: ${{ steps.scopes.outputs.code }}
      long_test_groups: ${{ steps.scopes.outputs.long_test_groups }}
      quality: ${{ steps.scopes.outputs.quality }}
      release: ${{ steps.scopes.outputs.release }}
      site_check: ${{ steps.scopes.outputs.site_check }}
      site_build: ${{ steps.scopes.outputs.site_build }}
      windows: ${{ steps.scopes.outputs.windows }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - id: scopes
        name: Select required checks conservatively
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun test/ci/ci-scopes.ts --base "$BASE_SHA" --head "$HEAD_SHA"

  quality:
    name: Static checks and build
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate GitHub Actions workflows
        if: needs.changes.outputs.actions == 'true'
        uses: docker://rhysd/actionlint:1.7.8
        with:
          args: -color

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - run: bun run prettier:check

      - run: bun run lint
        if: needs.changes.outputs.code == 'true'

      - run: bun run typecheck
        if: needs.changes.outputs.code == 'true'

      - name: Check website contracts
        if: needs.changes.outputs.site_check == 'true' && needs.changes.outputs.code != 'true'
        run: bun run site:check

      - run: bun run site:build
        if: needs.changes.outputs.site_build == 'true'
        env:
          THREADNOTE_SITE_BASE: /

      - run: bun run build
        if: needs.changes.outputs.release == 'true'

      - run: bun run check:self-contained
        if: needs.changes.outputs.release == 'true'

  standard_tests:
    name: Tests · standard ${{ matrix.shard }}/4
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Run ordinary tests with all available Vitest workers
        run: bun --bun vitest run --shard=${{ matrix.shard }}/4
        env:
          THREADNOTE_VITEST_STANDARD_SHARD: ${{ matrix.shard }}

  long_tests:
    name: Tests · long · ${{ matrix.group }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.changes.outputs.long_test_groups) }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Run isolated long-running group with bounded Vitest workers
        run: bun --bun vitest run
        env:
          THREADNOTE_VITEST_LONG_GROUP: ${{ matrix.group }}

  test:
    name: Unit and integration tests
    needs: [changes, quality, standard_tests, long_tests]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require every applicable test shard
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          STANDARD_RESULT: ${{ needs.standard_tests.result }}
          LONG_RESULT: ${{ needs.long_tests.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$QUALITY_RESULT" = success
          if [ "$CODE_CHANGED" = true ]; then
            test "$STANDARD_RESULT" = success
            test "$LONG_RESULT" = success
          fi

  recall-quality:
    name: Recall quality and non-inferiority
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Frozen v1 quality and indexed-recall smoke
        run: bun run eval:recall

      - name: Frozen native code graph quality gate
        run: bun run eval:code-graph

      - name: Recall-v2 category and safety gate
        run: >-
          bun run eval:recall:v2 --
          --baseline test/evaluation/baselines/threadnote-3.0.3/recall-v2-lexical.json
          --fail-on-regression
          --max-failures 10

  windows-smoke:
    name: Bun unit smoke · Windows
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: >-
          bun --bun vitest run
          test/unit/windows-support.test.ts
          test/unit/effect-command.test.ts
          test/unit/effect-system.test.ts
          test/unit/local-ai.test.ts
          test/unit/update.test.ts
          test/unit/mcp.test.ts

  prepare-e2e-model:
    name: Prepare pinned E2E model
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Restore verified model cache
        id: model-cache
        uses: actions/cache@v6
        with:
          key: threadnote-e2e-model-${{ env.E2E_EMBEDDING_MODEL_SHA256 }}
          path: artifacts/e2e-model-home/models/embedding/${{ env.E2E_EMBEDDING_MODEL_ID }}

      - name: Download and verify pinned model once
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: >-
          bun src/standalone.ts
          --home artifacts/e2e-model-home
          models install ${{ env.E2E_EMBEDDING_MODEL_ID }}

      - name: Share pinned model with platform E2E jobs
        uses: actions/upload-artifact@v7
        with:
          name: e2e-core-embedding-model
          path: artifacts/e2e-model-home/models/embedding/${{ env.E2E_EMBEDDING_MODEL_ID }}/${{ env.E2E_EMBEDDING_MODEL_SHA256 }}.gguf
          retention-days: 1

  standalone-targets:
    name: Bytecode compile · ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - bun-darwin-arm64
          - bun-darwin-x64
          - bun-linux-arm64
          - bun-linux-arm64-musl
          - bun-linux-x64-baseline
          - bun-linux-x64-musl-baseline
          - bun-windows-arm64
          - bun-windows-x64-baseline

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile
      - run: bun run compile:targets
        env:
          THREADNOTE_BUILD_TARGET: ${{ matrix.target }}

  self-contained-distribution:
    name: Self-contained Bun release · ${{ matrix.os }}
    needs: [changes, prepare-e2e-model]
    if: needs.changes.outputs.release == 'true' && needs.prepare-e2e-model.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        # Gate both exact macOS runner architectures used by the release workflow.
        os: [ubuntu-latest, macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Download pinned E2E model
        uses: actions/download-artifact@v8
        with:
          name: e2e-core-embedding-model
          path: artifacts/e2e-model-fixture

      - run: bun run check:self-contained
      - name: Platform process identity smoke
        run: bun --bun vitest run test/unit/effect-system.test.ts
      - run: bun run test:smoke:self-contained

      - name: Installed release E2E
        run: bun run test:e2e:local-bins
        env:
          THREADNOTE_E2E_MODEL_PATH: ${{ github.workspace }}/artifacts/e2e-model-fixture/${{ env.E2E_EMBEDDING_MODEL_SHA256 }}.gguf
