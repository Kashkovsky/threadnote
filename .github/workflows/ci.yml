name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex/4.0.0]

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  E2E_EMBEDDING_MODEL_ID: bge-small-en-v1.5-q8
  E2E_EMBEDDING_MODEL_SHA256: f046db1dc724cf4f6f0a0c5917e922823b73eb1d27b8f9a9c2797f7866974804

jobs:
  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.8
        with:
          args: -color

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run prettier:check
      - run: bun run typecheck
      - run: bun run site:build
        env:
          THREADNOTE_SITE_BASE: /
      - run: bun run build
      - run: bun run check:self-contained
      - run: bun run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  recall-quality:
    name: Recall quality and non-inferiority
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Frozen v1 quality and indexed-recall smoke
        run: bun run eval:recall

      - name: Frozen native code graph quality gate
        run: bun run eval:code-graph

      - name: Recall-v2 category and safety gate
        run: >-
          bun run eval:recall:v2 --
          --baseline test/evaluation/baselines/threadnote-3.0.3/recall-v2-lexical.json
          --fail-on-regression
          --max-failures 10

  windows-smoke:
    name: Bun unit smoke · Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: >-
          bun --bun vitest run
          test/unit/windows-support.test.ts
          test/unit/effect-command.test.ts
          test/unit/effect-system.test.ts
          test/unit/local-ai.test.ts
          test/unit/update.test.ts
          test/unit/mcp.test.ts

  prepare-e2e-model:
    name: Prepare pinned E2E model
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Restore verified model cache
        id: model-cache
        uses: actions/cache@v5
        with:
          key: threadnote-e2e-model-${{ env.E2E_EMBEDDING_MODEL_SHA256 }}
          path: artifacts/e2e-model-home/models/embedding/${{ env.E2E_EMBEDDING_MODEL_ID }}

      - name: Download and verify pinned model once
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: >-
          bun src/standalone.ts
          --home artifacts/e2e-model-home
          models install ${{ env.E2E_EMBEDDING_MODEL_ID }}

      - name: Share pinned model with platform E2E jobs
        uses: actions/upload-artifact@v7
        with:
          name: e2e-core-embedding-model
          path: artifacts/e2e-model-home/models/embedding/${{ env.E2E_EMBEDDING_MODEL_ID }}/${{ env.E2E_EMBEDDING_MODEL_SHA256 }}.gguf
          retention-days: 1

  standalone-targets:
    name: Bytecode compile · ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - bun-darwin-arm64
          - bun-darwin-x64
          - bun-linux-arm64
          - bun-linux-arm64-musl
          - bun-linux-x64-baseline
          - bun-linux-x64-musl-baseline
          - bun-windows-arm64
          - bun-windows-x64-baseline

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile
      - run: bun run compile:targets
        env:
          THREADNOTE_BUILD_TARGET: ${{ matrix.target }}

  self-contained-distribution:
    name: Self-contained Bun release · ${{ matrix.os }}
    needs: prepare-e2e-model
    strategy:
      fail-fast: false
      matrix:
        # Keep broad current-platform coverage and also gate the exact Apple Silicon
        # runner label used by the release workflow.
        os: [ubuntu-latest, macos-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Download pinned E2E model
        uses: actions/download-artifact@v8
        with:
          name: e2e-core-embedding-model
          path: artifacts/e2e-model-fixture

      - run: bun run check:self-contained
      - name: Platform process identity smoke
        run: bun --bun vitest run test/unit/effect-system.test.ts
      - run: bun run test:smoke:self-contained

      - name: Installed release E2E
        run: bun run test:e2e:local-bins
        env:
          THREADNOTE_E2E_MODEL_PATH: ${{ github.workspace }}/artifacts/e2e-model-fixture/${{ env.E2E_EMBEDDING_MODEL_SHA256 }}.gguf
