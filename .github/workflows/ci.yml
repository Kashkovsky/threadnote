name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex/4.0.0]

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run prettier:check
      - run: bun run typecheck
      - run: bun run build
      - run: bun run check:self-contained
      - run: bun run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  recall-quality:
    name: Recall quality and non-inferiority
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Frozen v1 quality and indexed-recall smoke
        run: bun run eval:recall

      - name: Recall-v2 category and safety gate
        run: >-
          bun run eval:recall:v2 --
          --baseline test/evaluation/baselines/threadnote-3.0.3/recall-v2-lexical.json
          --fail-on-regression
          --max-failures 10

  windows-smoke:
    name: Bun unit smoke · Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: >-
          bun --bun vitest run
          test/unit/windows-support.test.ts
          test/unit/effect-command.test.ts
          test/unit/effect-system.test.ts
          test/unit/local-ai.test.ts
          test/unit/update.test.ts
          test/unit/mcp.test.ts

  standalone-targets:
    name: Bytecode compile · ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - bun-darwin-arm64
          - bun-darwin-x64
          - bun-linux-arm64
          - bun-linux-arm64-musl
          - bun-linux-x64-baseline
          - bun-linux-x64-musl-baseline
          - bun-windows-arm64
          - bun-windows-x64-baseline

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile
      - run: bun run compile:targets
        env:
          THREADNOTE_BUILD_TARGET: ${{ matrix.target }}

  self-contained-distribution:
    name: Self-contained Bun release · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile
      - run: bun run check:self-contained
      - name: Platform process identity smoke
        run: bun --bun vitest run test/unit/effect-system.test.ts
      - run: bun run test:smoke:self-contained

      - name: Installed release E2E
        run: bun run test:e2e:local-bins
