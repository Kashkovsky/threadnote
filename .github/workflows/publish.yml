name: Publish standalone release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_commit: ${{ steps.release_source.outputs.release_commit }}
    env:
      CI: '1'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Verify release tag matches package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          package_tag="v$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          release_tag="${{ github.ref_name }}"
          if [ "$package_tag" != "$release_tag" ]; then
            echo "::error::package.json ($package_tag) does not match release tag ($release_tag)"
            exit 1
          fi

      - name: Verify versioned release notes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          release_notes_file=".github/release-notes/${{ github.ref_name }}.md"
          if [[ ! -s "$release_notes_file" ]]; then
            echo "::error::Add non-empty release notes at $release_notes_file before tagging the release."
            exit 1
          fi
          first_non_empty_line="$(sed -n '/[^[:space:]]/{p;q;}' "$release_notes_file")"
          if [[ "$first_non_empty_line" != "## What's new" ]]; then
            echo "::error::$release_notes_file must begin with the heading: ## What's new"
            exit 1
          fi

      - name: Resolve exact release source
        if: github.event_name == 'push'
        id: release_source
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${{ github.ref_name }}"
          head_commit="$(git rev-parse 'HEAD^{commit}')"
          event_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          tag_commit="$(git rev-parse "refs/tags/${release_tag}^{commit}")"
          if [[ "$GITHUB_REF" != "refs/tags/${release_tag}" || "$head_commit" != "$event_commit" || "$head_commit" != "$tag_commit" ]]; then
            echo "::error::Release verification must run from the exact pushed tag commit."
            exit 1
          fi
          if ! git rev-parse --verify refs/remotes/origin/main >/dev/null || ! git merge-base --is-ancestor "$head_commit" refs/remotes/origin/main; then
            echo "::error::The exact release tag commit must be present on protected origin/main."
            exit 1
          fi
          printf 'release_commit=%s\n' "$head_commit" >> "$GITHUB_OUTPUT"

      - name: Run release contract smokes
        run: bun run test:smoke:release

  linux:
    name: Linux · ${{ matrix.architecture }}
    if: github.event_name == 'push'
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: ubuntu-latest
            target: bun-linux-x64-baseline
          - architecture: arm64
            runner: ubuntu-24.04-arm
            target: bun-linux-arm64

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 3
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Select exact verified release source
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.verify.outputs.release_commit }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            selected_commit="$GITHUB_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == 'push' && "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            selected_commit="$RELEASE_COMMIT"
          else
            echo "::error::Release payload build is missing the exact verifier-selected tag commit."
            exit 1
          fi
          git checkout --detach "$selected_commit"
          if [[ "$(git rev-parse 'HEAD^{commit}')" != "$selected_commit" ]] || [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "::error::Release payload source differs from the exact verified tag commit."
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          THREADNOTE_BUILD_TARGET: ${{ matrix.target }}
      - run: ./dist/threadnote --version
      - name: Prepare strict doctor fixture
        shell: bash
        env:
          CI: '1'
          HOME: ${{ runner.temp }}/threadnote-release-user
          THREADNOTE_BIN_DIR: ${{ runner.temp }}/threadnote-release-bin
          THREADNOTE_HOME: ${{ runner.temp }}/threadnote-release-home
          THREADNOTE_INSTALL_ROOT: ${{ runner.temp }}/threadnote-release-install
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          ./dist/threadnote --home "$THREADNOTE_HOME" install --no-start
      - name: Verify release with strict read-only doctor
        env:
          CI: '1'
          HOME: ${{ runner.temp }}/threadnote-release-user
          THREADNOTE_BIN_DIR: ${{ runner.temp }}/threadnote-release-bin
          THREADNOTE_HOME: ${{ runner.temp }}/threadnote-release-home
          THREADNOTE_INSTALL_ROOT: ${{ runner.temp }}/threadnote-release-install
        run: ./dist/threadnote --home "$THREADNOTE_HOME" doctor --dry-run --strict
      - name: Produce a real embedding with the release payload
        run: bun --bun vitest run --config vitest.e2e.config.ts test/e2e/local-bins.e2e.ts
      - run: bun run archive:release
        env:
          THREADNOTE_RELEASE_TARGET: linux-${{ matrix.architecture }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.architecture }}
          path: artifacts/
          if-no-files-found: error

  macos:
    name: macOS · ${{ matrix.architecture }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
            target: bun-darwin-arm64
          - architecture: x64
            runner: macos-15-intel
            target: bun-darwin-x64

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 3
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Select exact verified release source
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.verify.outputs.release_commit }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            selected_commit="$GITHUB_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == 'push' && "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            selected_commit="$RELEASE_COMMIT"
          else
            echo "::error::Release payload build is missing the exact verifier-selected tag commit."
            exit 1
          fi
          git checkout --detach "$selected_commit"
          if [[ "$(git rev-parse 'HEAD^{commit}')" != "$selected_commit" ]] || [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "::error::Release payload source differs from the exact verified tag commit."
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          THREADNOTE_BUILD_TARGET: ${{ matrix.target }}
      - run: ./dist/threadnote --version
      - name: Prepare strict doctor fixture
        shell: bash
        env:
          CI: '1'
          HOME: ${{ runner.temp }}/threadnote-release-user
          THREADNOTE_BIN_DIR: ${{ runner.temp }}/threadnote-release-bin
          THREADNOTE_HOME: ${{ runner.temp }}/threadnote-release-home
          THREADNOTE_INSTALL_ROOT: ${{ runner.temp }}/threadnote-release-install
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          ./dist/threadnote --home "$THREADNOTE_HOME" install --no-start
      - name: Verify release with strict read-only doctor
        env:
          CI: '1'
          HOME: ${{ runner.temp }}/threadnote-release-user
          THREADNOTE_BIN_DIR: ${{ runner.temp }}/threadnote-release-bin
          THREADNOTE_HOME: ${{ runner.temp }}/threadnote-release-home
          THREADNOTE_INSTALL_ROOT: ${{ runner.temp }}/threadnote-release-install
        run: ./dist/threadnote --home "$THREADNOTE_HOME" doctor --dry-run --strict
      - name: Produce a real embedding with the release payload
        run: bun --bun vitest run --config vitest.e2e.config.ts test/e2e/local-bins.e2e.ts

      - name: Import and select Developer ID certificate
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/threadnote-developer-id.p12"
          keychain_path="$RUNNER_TEMP/threadnote-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          identity_output="$(security find-identity -v -p codesigning "$keychain_path")"
          identity_hashes="$(
            printf '%s\n' "$identity_output" |
              awk '/"Developer ID Application:/ { print $2 }'
          )"
          identity_count="$(
            printf '%s\n' "$identity_hashes" |
              awk 'NF { count += 1 } END { print count + 0 }'
          )"
          if [[ "$identity_count" -ne 1 ]]; then
            printf '%s\n' "$identity_output"
            echo "::error::Expected exactly one valid Developer ID Application identity, found $identity_count."
            exit 1
          fi
          printf 'APPLE_SIGNING_IDENTITY=%s\n' "$identity_hashes" >> "$GITHUB_ENV"

      - name: Sign nested native code and Bun executable
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' native_file; do
            if file "$native_file" | grep -q 'Mach-O'; then
              codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$native_file"
              codesign --verify --strict --verbose=2 "$native_file"
            fi
          done < <(find dist/runtime -type f -print0)
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --entitlements scripts/macos-entitlements.plist \
            --sign "$APPLE_SIGNING_IDENTITY" \
            dist/threadnote
          codesign --verify --strict --verbose=2 dist/threadnote

      - name: Notarize the exact release payload
        shell: bash
        env:
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          notary_key="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          notarization_zip="$RUNNER_TEMP/threadnote-notarization.zip"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 --decode > "$notary_key"
          ditto -c -k --keepParent dist "$notarization_zip"
          xcrun notarytool submit "$notarization_zip" \
            --key "$notary_key" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait
          codesign --verify --strict --verbose=2 dist/threadnote

      - run: bun run archive:release
        env:
          THREADNOTE_RELEASE_TARGET: darwin-${{ matrix.architecture }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-darwin-${{ matrix.architecture }}
          path: artifacts/
          if-no-files-found: error

  windows-build:
    name: Windows · ${{ matrix.architecture }} · unsigned
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2025
            target: bun-windows-x64-baseline
          - architecture: arm64
            runner: windows-11-arm
            target: bun-windows-arm64

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 3
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Select exact verified release source
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.verify.outputs.release_commit }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            selected_commit="$GITHUB_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == 'push' && "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            selected_commit="$RELEASE_COMMIT"
          else
            echo "::error::Release payload build is missing the exact verifier-selected tag commit."
            exit 1
          fi
          git checkout --detach "$selected_commit"
          if [[ "$(git rev-parse 'HEAD^{commit}')" != "$selected_commit" ]] || [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "::error::Release payload source differs from the exact verified tag commit."
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Preload checksum-pinned Bun baseline compiler backend
        if: matrix.architecture == 'x64'
        shell: pwsh
        env:
          BUN_BASELINE_TARBALL_SHA512: b888cb502d52f435a0202ceea0c6daeefbab0499c1aee1384b90b19ef99991da96557473c75460bbadfa1e81fe934a9e6900858778de1b7250d72e9f447bf4b3
        run: |
          # Bun 1.3.14 cannot extract this backend itself on Windows (oven-sh/bun#28327).
          # Preserve Threadnote's baseline CPU contract by placing the exact official
          # package payload in the cache path Bun checks before attempting a download.
          $packageName = 'bun-windows-x64-baseline'
          $archive = Join-Path $env:RUNNER_TEMP "$packageName-$env:BUN_VERSION.tgz"
          $extractRoot = Join-Path $env:RUNNER_TEMP "$packageName-extracted"
          $packageUrl = "https://registry.npmjs.org/@oven/$packageName/-/$packageName-$env:BUN_VERSION.tgz"
          Invoke-WebRequest -Uri $packageUrl -OutFile $archive
          $actualDigest = (Get-FileHash -LiteralPath $archive -Algorithm SHA512).Hash.ToLowerInvariant()
          if ($actualDigest -ne $env:BUN_BASELINE_TARBALL_SHA512) {
            throw "Bun baseline compiler backend checksum mismatch."
          }
          New-Item -ItemType Directory -Force -Path $extractRoot | Out-Null
          tar -xzf $archive -C $extractRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $source = Join-Path $extractRoot 'package/bin/bun.exe'
          $cache = (& bun pm cache).Trim()
          $destination = Join-Path $cache "bun-windows-x64-baseline-v$env:BUN_VERSION"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          Copy-Item -LiteralPath $source -Destination $destination -Force
          if (-not (Test-Path -LiteralPath $destination -PathType Leaf)) {
            throw "Bun baseline compiler backend was not preloaded."
          }

      - run: bun run build
        env:
          THREADNOTE_BUILD_TARGET: ${{ matrix.target }}
      - name: Prepare fixture and verify with strict read-only doctor
        shell: pwsh
        env:
          CI: '1'
          HOME: ${{ runner.temp }}/threadnote-release-user
          USERPROFILE: ${{ runner.temp }}/threadnote-release-user
          THREADNOTE_BIN_DIR: ${{ runner.temp }}/threadnote-release-bin
          THREADNOTE_HOME: ${{ runner.temp }}/threadnote-release-home
          THREADNOTE_INSTALL_ROOT: ${{ runner.temp }}/threadnote-release-install
        run: |
          New-Item -ItemType Directory -Force -Path $env:HOME | Out-Null
          & .\dist\threadnote.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\threadnote.exe --home $env:THREADNOTE_HOME install --no-start
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\threadnote.exe --home $env:THREADNOTE_HOME doctor --dry-run --strict
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Produce a real embedding with the release payload
        run: bun --bun vitest run --config vitest.e2e.config.ts test/e2e/local-bins.e2e.ts

      - name: Verify PowerShell installer and installed runtime
        run: bun --bun vitest run --config vitest.windows-e2e.config.ts

      - run: bun run archive:release
        env:
          THREADNOTE_RELEASE_TARGET: windows-${{ matrix.architecture }}

      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-windows-${{ matrix.architecture }}
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.architecture }}
          path: artifacts/
          if-no-files-found: error

  windows-sign:
    name: Windows sign · ${{ matrix.architecture }} · disabled
    # Keep the implementation ready for the Authenticode work without publishing unsigned artifacts.
    if: ${{ false }}
    needs: windows-build
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: unsigned-windows-${{ matrix.architecture }}
          path: dist

      - name: Azure login for Artifact Signing
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticode-sign executable and native payload
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe,dll,node
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $signedFiles = Get-ChildItem dist -Recurse -File | Where-Object {
            $_.Extension -in '.exe', '.dll', '.node'
          }
          if ($signedFiles.Count -eq 0) {
            throw 'No Windows executable or native library was found to verify.'
          }
          foreach ($file in $signedFiles) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature for $($file.FullName): $($signature.Status)"
            }
          }

      - run: bun run archive:release
        env:
          THREADNOTE_RELEASE_TARGET: windows-${{ matrix.architecture }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.architecture }}
          path: artifacts/
          if-no-files-found: error

  publish-release:
    # Production-large evidence has a separate bounded tag workflow so release status reflects distribution only.
    name: Publish complete immutable release
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.verify.result == 'success' &&
      needs.linux.result == 'success' &&
      needs.macos.result == 'success' &&
      needs.windows-build.result == 'success'
    needs: [verify, linux, macos, windows-build]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release-assets.yml
    with:
      release_tag: ${{ github.ref_name }}
      release_sha: ${{ github.sha }}
