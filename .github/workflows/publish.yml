name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing + provenance

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing requires npm >= 11.5.1. Keep the major compatible
      # with the Node 22 runner instead of inheriting npm 12 engine changes.
      - run: npm install -g npm@11

      - run: npm ci

      - name: Verify release tag matches package version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          tag="${{ github.event.release.tag_name }}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::package.json ($pkg) does not match release tag ($tag)"
            exit 1
          fi

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test

      # No NODE_AUTH_TOKEN: auth comes from the OIDC trusted publisher.
      # Provenance is attached automatically; --provenance makes it explicit.
      - name: Publish to npm
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          tag=latest
          if [ "$IS_PRERELEASE" = "true" ]; then
            tag=beta
          fi
          npm publish --provenance --access public --tag "$tag"
