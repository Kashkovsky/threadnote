name: Context Brief retained RSS diagnostic only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: context-brief-retained-rss-diagnostic-${{ github.ref }}
  cancel-in-progress: false
env:
  BUN_VERSION: '1.3.14'
jobs:
  context-brief-retained-rss-diagnostic:
    name: Context Brief RSS diagnostic · pinned macOS class · never qualification
    runs-on: macos-15
    timeout-minutes: 120
    env:
      THREADNOTE_BENCHMARK_RUNNER_CLASS: github-hosted-macos-15-ARM64
    steps:
      - name: Designate fresh diagnostic output outside checkout
        shell: bash
        run: |
          printf 'THREADNOTE_DIAGNOSTIC_ROOT=%s/threadnote-context-brief-rss-diagnostic-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Build instrumented diagnostic from unchanged e308 runtime
        run: bun test/helpers/node-context-brief-rss-diagnostic.ts
      - name: Run one diagnostic only, with unchanged workload and development-smoke identity
        shell: bash
        run: |
          set -euo pipefail
          bash "$THREADNOTE_DIAGNOSTIC_ROOT/run.sh" > "$THREADNOTE_DIAGNOSTIC_ROOT/run.stdout.json" 2> "$THREADNOTE_DIAGNOSTIC_ROOT/run.stderr.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: context-brief-retained-rss-DIAGNOSTIC-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.THREADNOTE_DIAGNOSTIC_ROOT }}/
          if-no-files-found: error
          retention-days: 90
