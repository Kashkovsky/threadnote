name: Platform benchmarks

on:
  pull_request:
    paths:
      - '.github/workflows/benchmarks.yml'
      - '.github/workflows/production-large-evidence.yml'
      - 'bun.lock'
      - 'package.json'
      - 'scripts/benchmark-code-graph.ts'
      - 'scripts/benchmark-code-graph-embedding-contexts.ts'
      - 'scripts/benchmark-code-graph-workset.ts'
      - 'scripts/benchmark-code-graph-heavy-tail.ts'
      - 'scripts/benchmark-context-brief-citations.ts'
      - 'scripts/benchmark-context-brief-citations-target.ts'
      - 'scripts/benchmark-code-memory-link-scale.ts'
      - 'scripts/benchmark-code-memory-link-scale-target.ts'
      - 'scripts/generate-code-graph-heavy-tail-ratchet.ts'
      - 'scripts/generate-code-graph-production-ratchet.ts'
      - 'scripts/code-graph-benchmark-sampler.ts'
      - 'scripts/benchmark-recall-vectors.ts'
      - 'scripts/recall-vector-performance-budget.ts'
      - 'scripts/code-graph-fixture.ts'
      - 'scripts/code-graph-heavy-tail-fixture.ts'
      - 'test/evaluation/baselines/code-graph-v1/heavy-tail-scheduler-ratchet.json'
      - 'scripts/evaluate-code-graph-workset.ts'
      - 'scripts/evaluate-recall.ts'
      - 'scripts/support/code-graph-workset-fixture.ts'
      - 'scripts/support/code-graph-workset-harness.ts'
      - 'src/code_graph/**'
      - 'src/crypto/**'
      - 'src/effect/ai/**'
      - 'src/effect/command.ts'
      - 'src/effect/digest.ts'
      - 'src/effect/file_lock.ts'
      - 'src/effect/runtime.ts'
      - 'src/effect/system.ts'
      - 'src/evaluation/**'
      - 'src/models/**'
      - 'src/recall/**'
      - 'src/search/chunker.ts'
      - 'src/search/vector-index.ts'
      - 'src/search/vector-search.ts'
      - 'src/storage/layout.ts'
      - 'test/evaluation/baselines/code-graph-v1/**'
      - 'test/evaluation/baselines/code-graph-workset-v1/**'
      - 'test/evaluation/baselines/context-brief-citations-v1/**'
      - 'test/evaluation/baselines/code-memory-link-scale-v1/**'
      - 'test/evaluation/candidates/threadnote-4.0.0/**'
      - 'test/evaluation/fixtures/code-graph-v1/**'
      - 'test/evaluation/fixtures/code-graph-workset-v1/**'
      - 'test/evaluation/fixtures/recall-v1/**'
      - 'test/unit/code-graph.workset-fixture.test.ts'
      - 'test/unit/code-graph.workset-harness.test.ts'
      - 'test/unit/evaluation.agent-response.test.ts'
      - 'test/unit/evaluation.code-graph-workset.test.ts'
  workflow_dispatch:
    inputs:
      include_100k:
        description: Run the 100k scale-boundary suite on Linux
        required: false
        type: boolean
        default: false
      include_production_large:
        description: Run the n=1 73k-repository/59,936-eligible profile target for the 4.1 beta surrogate
        required: false
        type: boolean
        default: false
      include_heavy_tail:
        description: Run parser/cache heavy-tail coverage; this is not a production materialization benchmark
        required: false
        type: boolean
        default: false
      include_context_brief_citations_scale:
        description: Run the built Context Brief citation 100k/50/128 scale gate
        required: false
        type: boolean
        default: false
      include_code_memory_link_scale:
        description: Run the governed 100,000-memory code-to-memory inverse-selector gate
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14
  CODE_GRAPH_EMBEDDING_MODEL_ID: bge-small-en-v1.5-q8
  CODE_GRAPH_EMBEDDING_MODEL_SHA256: f046db1dc724cf4f6f0a0c5917e922823b73eb1d27b8f9a9c2797f7866974804

jobs:
  recall-pr-10k:
    name: Recall production 10k · Linux
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Gate production lexical and exact-search behavior
        run: bun run eval:recall

      - name: Gate paged vector storage and incremental reuse
        run: >-
          bun run bench:recall:vectors --
          --documents 10000
          --samples 5
          --fail-on-budget
          --output artifacts/recall-vectors-pr-10000-Linux-${{ runner.arch }}.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: recall-vector-benchmark-pr-10000-Linux-${{ runner.arch }}
          path: artifacts/recall-vectors-pr-10000-Linux-${{ runner.arch }}.json
          if-no-files-found: warn
          retention-days: 14

  code-graph-pr-scale:
    name: Code graph PR lexical ${{ matrix.scale }} · Linux
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        scale: [10000, 100000]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Gate changed graph runtime at ${{ matrix.scale }} symbols
        run: >-
          bun run bench:code-graph --
          --scale-symbols ${{ matrix.scale }}
          --samples 3
          --warmups 1
          --fail-on-budget
          --output artifacts/code-graph-pr-${{ matrix.scale }}-Linux-${{ runner.arch }}.json

      - uses: actions/upload-artifact@v7
        with:
          name: code-graph-pr-${{ matrix.scale }}-Linux-${{ runner.arch }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  code-graph:
    name: Code graph · ${{ matrix.os }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Gate native graph quality
        run: bun run eval:code-graph

      - name: Capture native graph benchmark
        run: >-
          bun run bench:code-graph --
          --samples 25
          --warmups 5
          --fail-on-budget
          --output artifacts/code-graph-${{ runner.os }}-${{ runner.arch }}.json

      - uses: actions/upload-artifact@v7
        with:
          name: code-graph-benchmarks-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  code-graph-workset:
    name: Code graph workset 32/50/64/128 · pinned Linux class
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Gate the complete workset correctness matrix
        run: >-
          bun run eval:code-graph-workset --
          --sizes 1,8,32,64,128
          --output artifacts/code-graph-workset-quality-Linux-${{ runner.arch }}.json

      - name: Capture current workset latency and agent-response evidence
        run: >-
          bun run bench:code-graph-workset --
          --sizes 32,50,64,128
          --samples 25
          --warmups 5
          --output artifacts/code-graph-workset-benchmark-Linux-${{ runner.arch }}.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: code-graph-workset-Linux-${{ runner.arch }}-${{ github.run_id }}
          path: artifacts/code-graph-workset-*.json
          if-no-files-found: error
          retention-days: 30

  context-brief-citations-scale:
    name: Context Brief citations 100k memories / 50 / 128 · pinned Linux class
    if: github.event_name == 'schedule' || inputs.include_context_brief_citations_scale
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Build and gate warm-ready Context Brief citation scale evidence
        env:
          THREADNOTE_BENCHMARK_RUNNER_CLASS: github-hosted-ubuntu-24.04-${{ runner.arch }}
        run: >-
          bun run bench:context-brief-citations --
          --memory-candidates 100000
          --samples 25
          --warmups 5
          --fail-on-budget
          --output artifacts/context-brief-citations-scale-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: context-brief-citations-scale-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          path: artifacts/context-brief-citations-scale-*.json
          if-no-files-found: error
          retention-days: 90

  code-memory-link-inverse-scale:
    name: Code-to-memory inverse selector · 100,000 memories · release macOS class
    if: github.event_name == 'schedule' || inputs.include_code_memory_link_scale
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Build and gate the production inverse-selector path at 100,000 memories
        env:
          THREADNOTE_BENCHMARK_RUNNER_CLASS: github-hosted-macos-15-ARM64
        run: >-
          bun run bench:code-memory-link-scale --
          --candidate-commit "${{ github.sha }}"
          --output artifacts/code-memory-link-inverse-scale-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}.json

      - name: Stage the exact content-addressed G artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(find artifacts -maxdepth 1 -type f -name 'code-memory-link-inverse-scale-*.json' -print -quit)"
          if [[ -z "$artifact" ]]; then
            echo "::error::The governed inverse-selector scale artifact is missing."
            exit 1
          fi
          artifact_hash="$(shasum -a 256 "$artifact" | awk '{print $1}')"
          retained_root="artifacts/test/evaluation/retained/code-memory-link-scale"
          mkdir -p "$retained_root"
          mv "$artifact" "$retained_root/${artifact_hash}.json"
          printf 'Retain at test/evaluation/retained/code-memory-link-scale/%s.json\n' "$artifact_hash"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: code-memory-link-inverse-scale-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          path: artifacts/test/evaluation/retained/code-memory-link-scale/*.json
          if-no-files-found: error
          retention-days: 90

  code-graph-10k:
    name: Code graph 10k · ${{ matrix.os }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Gate 10k-symbol indexing and queries
        run: >-
          bun run bench:code-graph --
          --scale-symbols 10000
          --samples 10
          --warmups 2
          --fail-on-budget
          --output artifacts/code-graph-10k-${{ runner.os }}-${{ runner.arch }}.json

      - uses: actions/upload-artifact@v7
        with:
          name: code-graph-benchmarks-10k-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  code-graph-load-evidence:
    name: Code graph load evidence · Linux
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Capture serialized database load evidence
        run: bun --bun vitest run
        env:
          THREADNOTE_VITEST_LONG_GROUP: load-evidence

  prepare-code-graph-vector-model:
    name: Prepare pinned graph model
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Restore verified graph model cache
        id: graph-model-cache
        uses: actions/cache@v6
        with:
          key: threadnote-code-graph-model-${{ env.CODE_GRAPH_EMBEDDING_MODEL_SHA256 }}
          path: artifacts/code-graph-model-home/models/embedding/${{ env.CODE_GRAPH_EMBEDDING_MODEL_ID }}

      - name: Download and verify the pinned graph model once
        if: steps.graph-model-cache.outputs.cache-hit != 'true'
        run: |
          for delay in 0 5 15 30; do
            if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
            if bun src/standalone.ts --home artifacts/code-graph-model-home models install "${CODE_GRAPH_EMBEDDING_MODEL_ID}"; then
              exit 0
            fi
          done
          exit 1

      - name: Share the pinned graph model with vector jobs
        uses: actions/upload-artifact@v7
        with:
          name: code-graph-core-embedding-model
          path: artifacts/code-graph-model-home/models/embedding/${{ env.CODE_GRAPH_EMBEDDING_MODEL_ID }}/${{ env.CODE_GRAPH_EMBEDDING_MODEL_SHA256 }}.gguf
          if-no-files-found: error
          retention-days: 1

  code-graph-vectors:
    name: Code graph pinned vectors · Linux
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: prepare-code-graph-vector-model
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Download pinned graph model
        uses: actions/download-artifact@v8
        with:
          name: code-graph-core-embedding-model
          path: artifacts/code-graph-model-home/models/embedding/${{ env.CODE_GRAPH_EMBEDDING_MODEL_ID }}

      - name: Gate production vector activation and semantic queries
        run: >-
          bun run bench:code-graph --
          --vectors
          --model-home artifacts/code-graph-model-home
          --samples 10
          --warmups 2
          --fail-on-budget
          --output artifacts/code-graph-vectors-Linux-${{ runner.arch }}.json

      - uses: actions/upload-artifact@v7
        with:
          name: code-graph-vector-benchmark-Linux-${{ runner.arch }}
          path: artifacts/code-graph-vectors-Linux-${{ runner.arch }}.json
          if-no-files-found: error
          retention-days: 30

  code-graph-vectors-10k:
    name: Code graph pinned vectors 10k · Linux
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: prepare-code-graph-vector-model
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Download pinned graph model
        uses: actions/download-artifact@v8
        with:
          name: code-graph-core-embedding-model
          path: artifacts/code-graph-model-home/models/embedding/${{ env.CODE_GRAPH_EMBEDDING_MODEL_ID }}

      - name: Gate 10k production-vector activation and scans
        run: >-
          bun run bench:code-graph --
          --vectors
          --scale-symbols 10000
          --model-home artifacts/code-graph-model-home
          --samples 5
          --warmups 1
          --fail-on-budget
          --output artifacts/code-graph-vectors-10k-Linux-${{ runner.arch }}.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: code-graph-vector-benchmark-10k-Linux-${{ runner.arch }}
          path: artifacts/code-graph-vectors-10k-Linux-${{ runner.arch }}.json
          if-no-files-found: warn
          retention-days: 30

  code-graph-100k:
    name: Code graph 100k scale boundary · Linux
    if: github.event_name == 'schedule' || inputs.include_100k
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Gate 100k-symbol indexing and queries
        run: >-
          bun run bench:code-graph --
          --scale-symbols 100000
          --samples 5
          --warmups 1
          --fail-on-budget
          --output artifacts/code-graph-100k-Linux-${{ runner.arch }}.json

      - uses: actions/upload-artifact@v7
        with:
          name: code-graph-benchmarks-100k-Linux-${{ runner.arch }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  code-graph-vectors-100k:
    name: Code graph pinned vectors 100k · Linux
    if: github.event_name == 'schedule' || inputs.include_100k
    needs: prepare-code-graph-vector-model
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Download pinned graph model
        uses: actions/download-artifact@v8
        with:
          name: code-graph-core-embedding-model
          path: artifacts/code-graph-model-home/models/embedding/${{ env.CODE_GRAPH_EMBEDDING_MODEL_ID }}

      - name: Gate 100k production-vector activation and scans
        run: >-
          bun run bench:code-graph --
          --vectors
          --scale-symbols 100000
          --model-home artifacts/code-graph-model-home
          --samples 3
          --warmups 1
          --fail-on-budget
          --output artifacts/code-graph-vectors-100k-Linux-${{ runner.arch }}.json

      - uses: actions/upload-artifact@v7
        with:
          name: code-graph-vector-benchmark-100k-Linux-${{ runner.arch }}
          path: artifacts/code-graph-vectors-100k-Linux-${{ runner.arch }}.json
          if-no-files-found: error
          retention-days: 30

  code-graph-production-large:
    if: github.event_name == 'schedule' || inputs.include_production_large
    uses: ./.github/workflows/production-large-evidence.yml

  code-graph-heavy-tail:
    name: Code graph parser/cache heavy tail · pinned Linux class
    if: github.event_name == 'schedule' || inputs.include_heavy_tail
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Capture parser heavy tail, cache determinism, and interruption resume
        timeout-minutes: 160
        env:
          THREADNOTE_BENCHMARK_RUNNER_CLASS: github-hosted-ubuntu-24.04-${{ runner.arch }}
          THREADNOTE_BENCHMARK_RUNNER_ID: ${{ runner.name }}
        run: >-
          bun run bench:code-graph:heavy-tail --
          --output artifacts/code-graph-heavy-tail-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}.json

      - uses: actions/upload-artifact@v7
        if: always()
        timeout-minutes: 10
        with:
          name: code-graph-heavy-tail-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          path: artifacts/code-graph-heavy-tail-*.json
          if-no-files-found: warn
          retention-days: 90

  recall-10k:
    name: Recall 10k · ${{ matrix.os }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Capture process benchmark
        run: >-
          bun run bench:recall --
          --documents 10000
          --samples 25
          --warmups 5
          --output artifacts/recall-10k-${{ runner.os }}-${{ runner.arch }}.json

      - name: Capture built-artifact microbenchmark
        shell: bash
        run: >-
          bun run bench:recall:micro --
          --output artifacts/recall-micro-${{ runner.os }}-${{ runner.arch }}.json

      - uses: actions/upload-artifact@v7
        with:
          name: recall-benchmarks-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  recall-100k:
    name: Recall 100k scale boundary · Linux
    if: github.event_name == 'schedule' || inputs.include_100k
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Capture 100k process benchmark
        run: >-
          bun run bench:recall --
          --documents 100000
          --samples 5
          --warmups 1
          --output artifacts/recall-100k-Linux-${{ runner.arch }}.json

      - uses: actions/upload-artifact@v7
        with:
          name: recall-benchmarks-100k-Linux-${{ runner.arch }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
