name: Website

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'package.json'
      - 'scripts/site-doc-pages.ts'
      - 'scripts/site-articles.ts'
      - 'scripts/site-performance-evidence.ts'
      - 'scripts/site-release-notes.ts'
      - 'scripts/site-release-social-image.ts'
      - 'src/evaluation/benchmark.ts'
      - '.github/release-notes/**'
      - 'test/evaluation/candidates/threadnote-4.0.0/benchmarks/darwin-arm64-m1-max/code-graph-intellij-*.json'
      - 'test/evaluation/candidates/threadnote-4.0.0/benchmarks/darwin-arm64-m1-max/code-graph-lexical-production-100k-*.json'
      - 'test/evaluation/candidates/threadnote-4.0.1/benchmarks/darwin-arm64-m1-max/code-graph-worktree-readiness-*.json'
      - 'website/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release that must be published before the website refreshes
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.2
  THREADNOTE_SITE_BASE: /

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile
      - run: bun run site:check

      - name: Load published immutable stable releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          published="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false and .immutable == true and .published_at != null) | {tagName: .tag_name, publishedAt: .published_at}' \
            | jq -s -c '.')"
          if [[ "$published" == '[]' ]]; then
            echo '::error::No published immutable stable releases were found.'
            exit 1
          fi
          if [[ -n "$EXPECTED_RELEASE_TAG" ]] && ! jq -e --arg tag "$EXPECTED_RELEASE_TAG" \
            'any(.[]; .tagName == $tag)' <<< "$published" >/dev/null; then
            echo "::error::${EXPECTED_RELEASE_TAG} is not a published immutable stable release."
            exit 1
          fi
          printf 'THREADNOTE_SITE_PUBLISHED_RELEASES=%s\n' "$published" >> "$GITHUB_ENV"

      - run: bun run site:build
        env:
          THREADNOTE_SITE_PUBLIC_BUILD: '1'

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist

  deploy:
    name: Deploy website
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
