name: Publish standalone release assets

on:
  workflow_call:
    inputs:
      release_tag:
        description: Exact annotated tag whose verified platform artifacts should be published
        required: true
        type: string
      release_sha:
        description: Exact tag-event Git object whose verified source produced the platform artifacts
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish complete immutable release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Create release only after every artifact is ready
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" =~ ^v5\.0\.0-beta\.[1-9][0-9]*$ ]]; then
            :
          elif bun -e '
            const tag = process.env.RELEASE_TAG;
            const match = /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.exec(tag ?? "");
            process.exit(match !== null && match.slice(1).every(component => Number.isSafeInteger(Number(component))) ? 0 : 1);
          '; then
            :
          else
            echo "::error::Release tags must be canonical safe-integer stable vX.Y.Z or numbered v5.0.0-beta.N."
            exit 1
          fi
          verify_beta_release_freeze() {
            local freeze_ruleset_id freeze_ruleset
            freeze_ruleset_id="$(
              gh api "/repos/${GITHUB_REPOSITORY}/rulesets?includes_parents=true" \
                --jq '.[] | select(.name == "Threadnote 5.0 beta publication freeze" and .target == "branch" and .enforcement == "active") | .id' |
                head -n 1
            )" || {
              echo "::error::Could not inspect the required beta publication freeze ruleset; refusing publication."
              exit 1
            }
            if [[ ! "$freeze_ruleset_id" =~ ^[0-9]+$ ]]; then
              echo "::error::The required active no-bypass beta publication freeze ruleset is missing."
              exit 1
            fi
            freeze_ruleset="$(gh api "/repos/${GITHUB_REPOSITORY}/rulesets/${freeze_ruleset_id}")" || {
              echo "::error::Could not read the required beta publication freeze ruleset; refusing publication."
              exit 1
            }
            RELEASE_FREEZE_RULESET="$freeze_ruleset" bun -e '
              const ruleset = JSON.parse(process.env.RELEASE_FREEZE_RULESET ?? "");
              const appliesToReleaseBranch = ruleset.conditions?.ref_name?.include?.includes("refs/heads/release/5.0.0");
              const hasNoBypassUpdateLock = ruleset.bypass_actors?.length === 0 && ruleset.rules?.some(rule =>
                rule.type === "update" && rule.parameters?.update_allows_fetch_and_merge === false,
              );
              process.exit(ruleset.enforcement === "active" && ruleset.target === "branch" && appliesToReleaseBranch && hasNoBypassUpdateLock ? 0 : 1);
            ' || {
              echo "::error::The beta publication freeze must actively no-bypass lock updates to release/5.0.0."
              exit 1
            }
          }
          verify_release_source() {
            if [[ "$RELEASE_TAG" == v5.0.0-beta.* ]]; then
              verify_beta_release_freeze
            fi
            git fetch --force --no-tags origin "refs/tags/${RELEASE_TAG}:refs/threadnote-release-tag"
            verified_commit="$(git rev-parse "${RELEASE_SHA}^{commit}")"
            remote_tag_commit="$(git rev-parse 'refs/threadnote-release-tag^{commit}')"
            checkout_commit="$(git rev-parse 'HEAD^{commit}')"
            if [[ "$checkout_commit" != "$verified_commit" || "$remote_tag_commit" != "$verified_commit" ]]; then
              echo "::error::Release tag moved away from the exact verified source commit."
              exit 1
            fi
            if [[ "$RELEASE_TAG" == v5.0.0-beta.* ]]; then
              git fetch --force --no-tags origin '+refs/heads/release/5.0.0:refs/remotes/origin/release/5.0.0'
              if ! git rev-parse --verify refs/remotes/origin/release/5.0.0 >/dev/null; then
                echo "::error::The protected origin/release/5.0.0 publication branch is missing."
                exit 1
              fi
              release_tip="$(git rev-parse 'refs/remotes/origin/release/5.0.0^{commit}')"
              if [[ "$verified_commit" != "$release_tip" ]]; then
                echo "::error::origin/release/5.0.0 moved after beta verification; refusing publication."
                exit 1
              fi
            fi
          }
          verify_release_source
          release_notes_file=".github/release-notes/${RELEASE_TAG}.md"
          release_notes="$(<"$release_notes_file")"
          release_flags=(--verify-tag --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          # This is the final practical gate. The release branch is frozen while beta publication runs.
          verify_release_source
          gh release create "$RELEASE_TAG" artifacts/* "${release_flags[@]}" --notes "$release_notes"

      - name: Verify release immutability
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          immutable="$(gh release view "$RELEASE_TAG" --json isImmutable --jq .isImmutable)"
          if [ "$immutable" != "true" ]; then
            echo "::error::Enable immutable releases in repository settings before publishing Threadnote."
            exit 1
          fi
