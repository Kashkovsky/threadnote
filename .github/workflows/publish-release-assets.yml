name: Publish standalone release assets

on:
  workflow_call:
    inputs:
      release_tag:
        description: Exact annotated tag whose verified platform artifacts should be published
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish complete immutable release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Create release only after every artifact is ready
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          release_notes_file=".github/release-notes/${RELEASE_TAG}.md"
          release_notes="$(<"$release_notes_file")"
          release_flags=(--verify-tag --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" artifacts/* "${release_flags[@]}" --notes "$release_notes"

      - name: Verify release immutability
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          immutable="$(gh release view "$RELEASE_TAG" --json isImmutable --jq .isImmutable)"
          if [ "$immutable" != "true" ]; then
            echo "::error::Enable immutable releases in repository settings before publishing Threadnote."
            exit 1
          fi
