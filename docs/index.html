<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b10" />
    <meta name="robots" content="noindex" />
    <title>Threadnote 4</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #080b10;
        color: #f4f8f7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 15% 15%, rgb(103 232 199 / 12%), transparent 34rem),
          linear-gradient(135deg, #080b10, #0b1117);
      }

      main {
        width: min(720px, 100%);
        padding: clamp(32px, 7vw, 72px);
        border: 1px solid rgb(103 232 199 / 20%);
        border-radius: 24px;
        background: rgb(12 17 23 / 88%);
        box-shadow: 0 30px 100px rgb(0 0 0 / 40%);
      }

      .mark {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #67e8c7;
        font-weight: 750;
        letter-spacing: -0.03em;
      }

      .mark::before {
        width: 12px;
        height: 12px;
        border: 2px solid currentColor;
        border-radius: 50%;
        box-shadow:
          16px 0 0 -4px #080b10,
          16px 0 0 -2px currentColor;
        content: '';
      }

      h1 {
        max-width: 12ch;
        margin: 40px 0 20px;
        font-size: clamp(44px, 10vw, 76px);
        line-height: 0.96;
        letter-spacing: -0.065em;
      }

      p {
        max-width: 58ch;
        color: #aebbb8;
        font-size: 18px;
        line-height: 1.65;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 32px;
      }

      a {
        min-height: 46px;
        display: inline-flex;
        align-items: center;
        padding: 0 18px;
        border: 1px solid #67e8c7;
        border-radius: 999px;
        color: #07110f;
        background: #67e8c7;
        font-weight: 700;
        text-decoration: none;
      }

      a + a {
        color: #dce6e4;
        background: transparent;
        border-color: rgb(220 230 228 / 25%);
      }

      a:focus-visible {
        outline: 3px solid #f5b95e;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark">threadnote</span>
      <h1>Your team remembers.</h1>
      <p>
        The Threadnote 4 website is moving to its new GitHub Pages deployment. Until the cutover is complete, the
        repository contains the current installation guide, architecture, and release documentation.
      </p>
      <nav aria-label="Threadnote resources">
        <a href="https://github.com/Kashkovsky/threadnote#readme">Read the docs</a>
        <a href="https://github.com/Kashkovsky/threadnote/releases">Get Threadnote</a>
      </nav>
    </main>
  </body>
</html>
