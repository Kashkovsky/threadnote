pid /run/nginx/nginx.pid;
error_log stderr warn;
worker_processes 1;

events {
  worker_connections 256;
}

http {
  access_log off;
  client_body_temp_path /run/nginx/body;
  proxy_temp_path /run/nginx/proxy;
  fastcgi_temp_path /run/nginx/fastcgi;
  uwsgi_temp_path /run/nginx/uwsgi;
  scgi_temp_path /run/nginx/scgi;
  server_tokens off;

  server {
    listen 0.0.0.0:8080;
    client_max_body_size 64k;
    proxy_connect_timeout 2s;
    proxy_send_timeout 15s;
    proxy_read_timeout 320s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Threadnote-Repository-Id $http_x_threadnote_repository_id;
    proxy_set_header X-Threadnote-Profile-Digest $http_x_threadnote_profile_digest;

    location = /readyz {
      proxy_pass http://127.0.0.1:18765/.well-known/threadnote-graph;
    }

    location = /.well-known/threadnote-graph {
      proxy_pass http://127.0.0.1:18765;
    }

    location = /v1/status {
      proxy_pass http://127.0.0.1:18765;
    }

    location = /v1/enroll {
      proxy_pass http://127.0.0.1:18765;
    }

    location = /v1/results {
      proxy_pass http://127.0.0.1:18765;
    }

    location ~ "^/v1/frontiers/[0-9a-f]{40}$" {
      proxy_pass http://127.0.0.1:18765;
    }

    location / {
      return 404;
    }
  }
}
